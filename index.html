<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Registro</title>
  <style>
    /* Estilos simples y limpios */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .contenedor {
      background-color: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }
    .grupo-formulario {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #34495e;
      font-size: 0.95em;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #dcdde1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1em;
      transition: border-color 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: #3498db;
      box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
    }
    input[readonly] {
      background-color: #f8f9fa;
      color: #495057;
    }
    #mensaje {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      min-height: 24px;
    }
    .exito { color: #27ae60; }
    .error { color: #e74c3c; }
    .cargando { color: #f39c12; }

    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1.1em;
      font-weight: 600;
      width: 100%;
      transition: background-color 0.3s ease;
      margin-top: 10px;
    }
    button:hover {
      background-color: #2980b9;
    }
    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>📋 Formulario de Registro</h1>
    
    <!-- Mensaje de estado para el usuario -->
    <div id="mensaje"></div>

    <form id="formularioRegistro" onsubmit="return false;">
      <div class="grupo-formulario">
        <label for="idInput">ID de Empleado/Cliente:</label>
        <input type="text" id="idInput" placeholder="Ingrese el ID" autocomplete="off" onchange="buscarDatos()">
        <!-- Usamos 'onchange' para que busque al perder el foco o presionar Enter -->
      </div>

      <div class="grupo-formulario">
        <label for="nombre">Nombre Completo:</label>
        <input type="text" id="nombre" readonly placeholder="Se autocompletará">
      </div>

      <div class="grupo-formulario">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" readonly placeholder="Se autocompletará">
      </div>

      <div class="grupo-formulario">
        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" readonly placeholder="Se autocompletará">
      </div>

      <button type="button" id="btnEnviar" onclick="enviarRegistro()">Confirmar y Guardar Registro</button>
    </form>
  </div>

  <script>
    // ¡¡¡CAMBIA ESTA URL POR LA DE TU WEB APP DE GOOGLE APPS SCRIPT!!!
    const URL_WEBAPP = 'https://script.google.com/macros/s/AKfycby4BDn3SoamF8srOWeWPBuPzXgLV0Gd45KBQaFp0-hb7CIYbti-ojVs_6E0SZwZgoo/exec';
    
    // Variable para saber si la búsqueda fue exitosa antes de enviar
    let busquedaExitosa = false;

    function mostrarMensaje(texto, tipo) {
      const mensajeDiv = document.getElementById('mensaje');
      mensajeDiv.textContent = texto;
      mensajeDiv.className = tipo; // 'exito', 'error' o 'cargando'
    }

    function limpiarCampos() {
      document.getElementById('nombre').value = '';
      document.getElementById('email').value = '';
      document.getElementById('telefono').value = '';
      busquedaExitosa = false;
    }

    async function buscarDatos() {
      const id = document.getElementById('idInput').value.trim();
      limpiarCampos(); // Limpia campos y resetea estado
      
      if (!id) {
        mostrarMensaje('Por favor, ingrese un ID.', 'error');
        return;
      }

      mostrarMensaje('Buscando...', 'cargando');

      try {
        // Llama a la función 'buscarPorId' del backend
        const response = await fetch(`${URL_WEBAPP}?id=${encodeURIComponent(id)}`);
        const data = await response.json();

        if (data.error) {
          mostrarMensaje(`Error: ${data.error}`, 'error');
        } else if (data.encontrado) {
          document.getElementById('nombre').value = data.nombre || '';
          document.getElementById('email').value = data.email || '';
          document.getElementById('telefono').value = data.telefono || '';
          mostrarMensaje('Datos cargados correctamente.', 'exito');
          busquedaExitosa = true; // Habilita el envío
        } else {
          mostrarMensaje('Estructura de datos inesperada.', 'error');
        }
      } catch (error) {
        console.error('Error de red o del servidor:', error);
        mostrarMensaje('Error de conexión. ¿Está bien la URL?', 'error');
      }
    }

    async function enviarRegistro() {
      const id = document.getElementById('idInput').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const telefono = document.getElementById('telefono').value.trim();

      if (!id || !nombre || !email || !telefono) {
        mostrarMensaje('Completa el ID y realiza la búsqueda primero.', 'error');
        return;
      }

      if (!busquedaExitosa) {
        mostrarMensaje('El ID no ha sido validado o no se encontró.', 'error');
        return;
      }

      // Preparamos los datos para enviar al backend
      const datosAEnviar = {
        id: id,
        nombre: nombre,
        email: email,
        telefono: telefono
      };

      const boton = document.getElementById('btnEnviar');
      boton.disabled = true;
      boton.textContent = 'Guardando...';
      mostrarMensaje('Guardando registro...', 'cargando');

      try {
        const response = await fetch(URL_WEBAPP, {
          method: 'POST',
          mode: 'no-cors', // 'no-cors' es necesario para llamadas de Apps Script a veces, pero puede limitar la lectura de la respuesta.
          cache: 'no-cache',
          headers: {
            'Content-Type': 'application/json',
          },
          redirect: 'follow',
          body: JSON.stringify(datosAEnviar)
        });
        
        // Debido a 'no-cors', no podemos leer la respuesta JSON directamente.
        // Mostramos un mensaje de éxito asumido y limpiamos el formulario.
        mostrarMensaje('¡Registro guardado exitosamente!', 'exito');
        document.getElementById('formularioRegistro').reset(); // Limpia TODO el formulario
        limpiarCampos(); // Asegura que el estado se resetee
        document.getElementById('idInput').focus(); // Vuelve al campo ID

      } catch (error) {
        console.error('Error al enviar:', error);
        mostrarMensaje('Error al guardar. Revisa la consola (F12).', 'error');
      } finally {
        boton.disabled = false;
        boton.textContent = 'Confirmar y Guardar Registro';
      }
    }
  </script>
</body>
</html>
